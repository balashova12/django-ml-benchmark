<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ML Benchmark</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>ML Algorithm Benchmark</h1>

    <h3>Свои алгоритмы</h3>
    <button onclick="run('knn')">KNN</button>
    <button onclick="run('tree')">Decision Tree</button>
    <button onclick="run('logistic')">Logistic Regression</button>

    <h3>Sklearn</h3>
    <button onclick="run('knn_lib')">KNN</button>
    <button onclick="run('tree_lib')">Decision Tree</button>
    <button onclick="run('logistic_lib')">Logistic Regression</button>

    <table border="1">
        <thead>
            <tr>
                <th>Алгоритм</th>
                <th>Время (сек)</th>
                <th>Память (КБ)</th>
                <th>Точность</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>

    <h3>Время выполнения</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartKnn_time"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartTree_time"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartLogistic_time"></canvas></div>
    </div>

    <h3>Использование памяти</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartKnn_memory_kb"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartTree_memory_kb"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartLogistic_memory_kb"></canvas></div>
    </div>

    <h3>Точность</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartKnn_accuracy"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartTree_accuracy"></canvas></div>
        <div style="flex: 1; min-width: 250px;"><canvas id="chart_chartLogistic_accuracy"></canvas></div>
    </div>

    <script>
        const names = {
            'knn': 'KNN (свой)',
            'knn_lib': 'KNN (sklearn)',
            'tree': 'Decision Tree (свой)',
            'tree_lib': 'Decision Tree (sklearn)',
            'logistic': 'Logistic Regression (свой)',
            'logistic_lib': 'Logistic Regression (sklearn)',
        };

        const results = {};

        async function run(algorithm) {
            const response = await fetch(`/run/${algorithm}/`);
            const data = await response.json();
            results[algorithm] = data;
            renderTable();
            renderChart(); 
        }

        function renderTable() {
            const tbody = document.getElementById('results');
            tbody.innerHTML = Object.entries(results).map(([alg, data]) => `
                <tr>
                    <td>${names[alg]}</td>
                    <td>${data.time}</td>
                    <td>${data.memory_kb}</td>
                    <td>${data.accuracy}</td>
                </tr>
            `).join('');
        }

        function renderChart() {
            const groups = [
                { id: 'chartKnn', label: 'KNN', custom: 'knn', lib: 'knn_lib' },
                { id: 'chartTree', label: 'Decision Tree', custom: 'tree', lib: 'tree_lib' },
                { id: 'chartLogistic', label: 'Logistic Regression', custom: 'logistic', lib: 'logistic_lib' },
            ];

            const metrics = [
                { key: 'time', label: 'сек', title: 'Время выполнения' },
                { key: 'memory_kb', label: 'КБ', title: 'Память' },
                { key: 'accuracy', label: '', title: 'Точность' },
            ];

            groups.forEach(group => {
                metrics.forEach(metric => {
                    const canvasId = `chart_${group.id}_${metric.key}`;
                    const canvas = document.getElementById(canvasId);
                    if (!canvas) return;
                    if (!results[group.custom] && !results[group.lib]) return;

                    const ctx = canvas.getContext('2d');
                    if (window[canvasId + '_chart']) window[canvasId + '_chart'].destroy();

                    window[canvasId + '_chart'] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Свой', 'Sklearn'],
                            datasets: [{
                                data: [
                                    results[group.custom] ? results[group.custom][metric.key] : 0,
                                    results[group.lib] ? results[group.lib][metric.key] : 0,
                                ],
                                backgroundColor: ['#4a90d9', '#27ae60'],
                                borderRadius: 4,
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                title: { display: true, text: `${group.label} — ${metric.title}` },
                                legend: { display: false },
                            },
                            scales: {
                                y: { beginAtZero: true, title: { display: true, text: metric.label } }
                            }
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
